# ── Mexxie Nginx Config ────────────────────────────────────────────
# Replace YOUR_DOMAIN with your actual domain (e.g. mexxie.yourdomain.com)
# This file is used by docker-compose.prod.yml

# Redirect HTTP → HTTPS and serve ACME (Let's Encrypt) challenges
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge directory (needed to get/renew SSL certs)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main production server
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # SSL certificate (issued by Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (allows GitHub Pages to call this API)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Handle CORS preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Proxy all /api/* requests to the Express API container
    location /api/ {
        proxy_pass         http://mexxie-api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large payloads (4000-stock sync batches)
        client_max_body_size 20m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # Optional: expose QuestDB web console at /questdb/
    # Uncomment only for development VMs — never expose in production!
    # location /questdb/ {
    #     proxy_pass http://questdb:9000/;
    #     proxy_set_header Host $host;
    # }

    # Block everything else
    location / {
        return 404;
    }
}

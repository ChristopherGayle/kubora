# ── Mexxie Prism — CLOUD PRODUCTION ───────────────────────────────
# Runs QuestDB + Express API + Nginx (HTTPS reverse proxy) on a cloud VM.
# Tested on: DigitalOcean, AWS EC2, Hetzner, Linode.
#
# Prerequisites on the VM:
#   1. docker + docker compose installed
#   2. Domain DNS A record pointing to the VM's IP
#   3. Port 80 and 443 open in firewall
#
# Setup steps:
#   1. Copy project to VM:  scp -r . user@your-vm:/opt/mexxie
#   2. Create env file:     cp .env.example .env.prod  → fill in values
#   3. Get SSL cert:        docker compose -f docker-compose.prod.yml run --rm certbot
#   4. Start everything:    docker compose -f docker-compose.prod.yml up -d
#
# After starting:
#   API URL: https://your-domain.com/api/health
#   Set this URL in Settings → API Server in the Mexxie app

name: mexxie-prod

services:

  # ── QuestDB ─────────────────────────────────────────────────────
  # NOT exposed to the internet — only accessible inside Docker network
  questdb:
    image: questdb/questdb:8.1.4
    container_name: mexxie-questdb
    expose:
      - "9000"    # Internal only — API connects to this
    volumes:
      - questdb_data:/root/.questdb
    environment:
      - QDB_HTTP_ENABLED=true
      - QDB_PG_ENABLED=false       # Disable Postgres wire in prod (not needed)
      - QDB_LINE_TCP_ENABLED=false # Disable InfluxDB line in prod (not needed)
      - QDB_HTTP_SECURITY_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/exec?query=SELECT+1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Express API ─────────────────────────────────────────────────
  mexxie-api:
    build:
      context: ./mexxie-api
      dockerfile: Dockerfile
    container_name: mexxie-api
    expose:
      - "3001"    # Internal only — Nginx proxies to this
    environment:
      - PORT=3001
      - QUESTDB_URL=http://questdb:9000
      - NODE_ENV=production
    env_file:
      - .env.prod    # Optional: EODHD_API_KEY, etc. for server-side refresh
    depends_on:
      questdb:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (HTTPS reverse proxy) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: mexxie-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - mexxie-api
    restart: unless-stopped

  # ── Certbot (SSL cert management) ───────────────────────────────
  # Run once to get cert:
  #   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
  #     --webroot --webroot-path /var/www/certbot \
  #     --email you@email.com --agree-tos --no-eff-email \
  #     -d your-domain.com
  # Renew (add to crontab):
  #   0 0 1 * * docker compose -f /opt/mexxie/docker-compose.prod.yml run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["sh", "-c", "certbot renew && echo 'Done'"]
    profiles:
      - certbot    # Only runs when explicitly called

volumes:
  questdb_data:
    name: mexxie_questdb_data
  certbot_certs:
    name: mexxie_ssl_certs
  certbot_webroot:
    name: mexxie_certbot_webroot

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .3s,color .3s}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer}
select{font-family:inherit;cursor:pointer}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',monospace}
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{-ms-overflow-style:none;scrollbar-width:none}
.stock-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.hero-card{grid-column:1/-1}
.stock-card{border-radius:14px;padding:20px;transition:transform .2s,box-shadow .2s;cursor:pointer;position:relative;overflow:hidden}
.stock-card:hover{transform:translateY(-2px)}
.score-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.score-ring-inner{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute}
.exec-summary{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s ease,padding .3s ease}
.exec-summary.open{max-height:900px;opacity:1;padding-top:16px}
.factor-bar{height:8px;border-radius:4px;overflow:hidden;position:relative}
.factor-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.25,.8,.25,1)}
.conviction-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.strength-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12px;line-height:1.5}
.risk-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:11px;line-height:1.5}
.prior-row{display:grid;grid-template-columns:1fr 90px 90px 90px auto;align-items:center;gap:12px}
.etf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.region-bar{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--bdr)}
.region-bar button{flex:1;padding:10px 6px;border:none;font-size:11px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap;letter-spacing:.3px}
.metric-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:10px;font-weight:600}
@media(max-width:900px){
  .stock-cards{grid-template-columns:1fr 1fr}
  .hero-card{grid-column:1/-1}
  .prior-row{grid-template-columns:1fr 70px auto;gap:8px}
  .prior-mid{display:none}
  .etf-grid,.strat-grid{grid-template-columns:1fr}
  .theme-grid{grid-template-columns:1fr}
  .weight-grid{grid-template-columns:1fr}
  .region-bar button{font-size:10px;padding:8px 4px}
}
@media(max-width:600px){
  .stock-cards{grid-template-columns:1fr}
  .hero-card{grid-column:auto}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,0.3)}70%{box-shadow:0 0 0 8px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
.fade-in{animation:fadeIn .3s ease-out both}
.bar-fill{transition:width .5s cubic-bezier(.25,.8,.25,1)}
.refresh-icon{display:inline-block;transition:transform .6s ease}
</style>
</head>

// Auto-detect: saved URL → localhost:3001 → Railway production (default for GitHub Pages)
var RAILWAY_DEFAULT='https://kubora-production.up.railway.app/api';
var API_BASE=(function(){
  try{var saved=localStorage.getItem('mexxie_api_url');if(saved&&saved.trim())return saved.trim().replace(/\/$/,'')+'/api';}catch(e){}
  var h=window.location.hostname;
  if(h==='localhost'||h==='127.0.0.1')return 'http://localhost:3001/api';
  return RAILWAY_DEFAULT; // GitHub Pages / any non-localhost → always try Railway
})();
var API_AVAILABLE=false;

async function checkAPI(){
  if(!API_BASE){API_AVAILABLE=false;return;}
  try{var r=await fetch(API_BASE+'/health',{signal:AbortSignal.timeout(3000)});var d=await r.json();API_AVAILABLE=d.status==='ok'||d.status==='degraded';}catch(e){API_AVAILABLE=false;}
}
async function loadStockUniverse(){
  if(!API_AVAILABLE)return;
  try{var r=await fetch(API_BASE+'/stocks?limit=5000');var d=await r.json();
    if(d&&d.length>0){ALL_STOCKS=d;console.log('Loaded '+d.length+' stocks from QuestDB');}
  }catch(e){console.log('API stock load failed, using fallback');}
}
async function loadPriorPicks(){
  if(!API_AVAILABLE)return;
  try{var r=await fetch(API_BASE+'/picks');var d=await r.json();
    if(d&&d.length>0){S.prior=d;console.log('Loaded '+d.length+' prior picks from QuestDB');}
  }catch(e){console.log('API picks load failed, using fallback');}
}
async function persistScores(){
  if(!API_AVAILABLE)return;
  try{
    var nw2=nW();
    // For large universes only persist stocks with live data (real-time enriched)
    var stocksToPersist=ALL_STOCKS.length>500?ALL_STOCKS.filter(function(st){return !!st.live}):ALL_STOCKS;
    if(stocksToPersist.length===0)return;
    console.log('Persisting scores for '+stocksToPersist.length+'/'+ALL_STOCKS.length+' stocks (live data)');
    var scores=stocksToPersist.map(function(st){var idx=ALL_STOCKS.indexOf(st);var sc=genSc(idx);
      if(st.live){
        if(st.live.pb!=null)sc.t.pb=+Math.abs(st.live.pb).toFixed(2);
        if(st.live.divYield!=null)sc.t.dy=+(st.live.divYield*100).toFixed(1);
        if(st.live.roe!=null)sc.g.roic=+(st.live.roe*100).toFixed(1);
        if(st.live.pe!=null&&st.live.pe>0)sc.g.ey=+(100/st.live.pe).toFixed(1);
        if(st.live.change!=null)sc.s.mom=+Math.min(100,Math.max(0,50+st.live.change*2)).toFixed(0);
        if(st.live.fcfYield!=null&&st.live.fcfYield>0)sc.t.fcf=+Math.min(14,st.live.fcfYield).toFixed(1);
        // EODHD-specific: use EMA-derived momentum if available (more accurate than daily change)
        if(st.live.mom!=null&&st.live.ema200)sc.s.mom=+Math.min(100,Math.max(0,50+st.live.mom*0.5)).toFixed(0);
        // EODHD: use 52-week range position as RSI proxy when real RSI unavailable
        if(st.live.range52!=null&&st.live.ema200)sc.s.rsi=+Math.min(85,Math.max(15,st.live.range52*0.7+15)).toFixed(0);
      }
      var cats=0;
      if(sc.g.ey>10||sc.t.pb<2)cats++;
      if(sc.m.moat>=3&&+sc.m.qual>70)cats++;
      if(+sc.s.mom>55&&+sc.s.rsi>=35&&+sc.s.rsi<=70)cats++;
      if(sc.p.fscore>=6&&sc.a.z>2)cats++;
      if(+sc.t.shY>5)cats++;
      return{ticker:st.t,sc:sc,comp:+comp(sc,nw2),consensus:cats};
    });
    await fetch(API_BASE+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({dataSeed:S.dataSeed,dataSource:S.lastSource,scores:scores})});
    console.log('Persisted '+scores.length+' scores to QuestDB');
  }catch(e){console.log('Score persist failed:',e.message);}
}
async function persistValuation(mv){
  if(!API_AVAILABLE||!mv)return;
  try{await fetch(API_BASE+'/valuation',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(mv)});}catch(e){}
}
async function persistPick(action,pick,data){
  if(!API_AVAILABLE)return;
  try{
    if(action==='add')await fetch(API_BASE+'/picks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pick)});
    else if(action==='update')await fetch(API_BASE+'/picks/'+pick.t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    else if(action==='delete')await fetch(API_BASE+'/picks/'+pick.t,{method:'DELETE'});
  }catch(e){}
}

function factorRating(val,thresholds){

}

// ======= TAX-AWARE RECOMMENDATION ENGINE =======
function priorRec(pk){
  var now=new Date();
  var picked=new Date(pk.date);
  // Bug fix: clamp to 0 — future-dated picks would produce negative daysHeld
  var daysHeld=Math.max(0,Math.floor((now-picked)/(1000*60*60*24)));
  var isLTCG=daysHeld>=365;
  var daysToLTCG=isLTCG?0:Math.max(0,365-daysHeld);
  var pct=((pk.curr-pk.entry)/pk.entry*100);
  var gain=pct>=0;
  var nw2=nW();
  var stObj=ALL_STOCKS.find(function(s){return s.t===pk.t});
  var score=0;
  if(stObj){
    var idx=ALL_STOCKS.indexOf(stObj);if(idx<0)idx=ALL_STOCKS.findIndex(function(s){return s.t===stObj.t});
    var sc=genSc(idx);
    if(stObj.live){
      if(stObj.live.pb!=null)sc.t.pb=+Math.abs(stObj.live.pb).toFixed(2);
      if(stObj.live.divYield!=null)sc.t.dy=+(stObj.live.divYield*100).toFixed(1);
      if(stObj.live.roe!=null)sc.g.roic=+(stObj.live.roe*100).toFixed(1);
      // Bug fix: negative P/E → EY=0 not simulated value
      if(stObj.live.pe!=null){if(stObj.live.pe>0)sc.g.ey=+(100/stObj.live.pe).toFixed(1);else sc.g.ey=0;}
      if(stObj.live.change!=null)sc.s.mom=+Math.min(100,Math.max(0,50+stObj.live.change*2)).toFixed(0);
      if(stObj.live.fcfYield!=null&&stObj.live.fcfYield>0)sc.t.fcf=+Math.min(14,stObj.live.fcfYield).toFixed(1);
    }
    score=+comp(sc,nw2);
  }
  var rec="HOLD";var reason="";var taxNote="";
  var stRate="22\u201337%";var ltRate="0\u201320%";
  if(gain){
    if(!isLTCG&&daysToLTCG<=90){rec="HOLD";reason="Only "+daysToLTCG+" days to LTCG qualification. Hold for lower tax rate.";taxNote="Short-term rate: "+stRate+" \u2192 Long-term rate: "+ltRate;}
    else if(!isLTCG&&pct>25){rec="HOLD";reason="Strong gain (+"+pct.toFixed(1)+"%) but short-term tax applies. Hold for LTCG.";taxNote="Selling now: "+stRate+" tax on $"+(pk.curr-pk.entry).toFixed(2)+" gain per share";}
    else if(isLTCG&&score<40&&pct>40){rec="SELL";reason="LTCG qualified. Score below 40 = weakening fundamentals. Take profits.";taxNote="Favorable "+ltRate+" long-term rate applies";}
    else if(isLTCG&&pct>60){rec="SELL";reason="LTCG qualified with +"+pct.toFixed(1)+"% gain. Consider partial profit-taking.";taxNote="Favorable "+ltRate+" long-term rate applies";}
    else if(score>=60){rec="BUY";reason="Score "+score.toFixed(0)+"/100 = strong fundamentals. Add to position.";taxNote=isLTCG?"LTCG qualified":"Short-term holding ("+daysHeld+" days)";}
    else{rec="HOLD";reason=score>=45?"Solid score ("+score.toFixed(0)+"). Fundamentals intact.":"Monitor \u2014 score at "+score.toFixed(0)+". Watch for deterioration.";taxNote=isLTCG?"LTCG qualified \u2014 "+ltRate+" on exit":(daysToLTCG+" days to LTCG qualification");}
  }else{
    if(!isLTCG&&pct<-10){rec="SELL";reason="Tax-loss harvest: short-term loss of "+pct.toFixed(1)+"% offsets gains at "+stRate+".";taxNote="Wash sale rule: cannot rebuy same stock within 30 days";}
    else if(isLTCG&&pct<-15){rec="SELL";reason="Long-term loss. Harvest to offset capital gains. Consider redeploying capital.";taxNote="Can offset LTCG or up to $3,000 ordinary income/year";}
    else if(pct<-25){rec="SELL";reason="Significant loss ("+pct.toFixed(1)+"%). Cut losses and reallocate.";taxNote=isLTCG?"Long-term loss deductible":"Short-term loss \u2014 higher deduction value";}
    else if(score>=55&&pct>-10){rec="BUY";reason="Score "+score.toFixed(0)+" is solid. Minor dip may be buying opportunity.";taxNote=isLTCG?"LTCG qualified":(daysHeld+" days held");}
    else{rec="HOLD";reason="Minor drawdown ("+pct.toFixed(1)+"%). Score: "+score.toFixed(0)+". Monitor recovery.";taxNote=isLTCG?"LTCG qualified":(daysToLTCG+" days to LTCG");}
  }
  return{rec:rec,reason:reason,taxNote:taxNote,daysHeld:daysHeld,isLTCG:isLTCG,daysToLTCG:daysToLTCG,pct:pct,score:score};
}

// ======= MAIN RENDER =======
function render(){
  var t=T();
  document.body.style.background=t.bg;document.body.style.color=t.text;
  var ds=document.getElementById("ds");
  if(!ds){ds=document.createElement("style");ds.id="ds";document.head.appendChild(ds)}
  ds.textContent="input[type=range]{background:"+t.rt+"}input[type=range]::-webkit-slider-thumb{background:"+t.rth+";border:2px solid "+t.accent+"}input[type=range]::-moz-range-thumb{background:"+t.rth+";border:2px solid "+t.accent+"}select{background:"+t.surface+";color:"+t.text+";border:1px solid "+t.border+";border-radius:4px;padding:4px 8px;font-size:13px}.region-bar{border-color:"+t.border+"}";
  var app=document.getElementById("app");app.innerHTML="";
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  app.appendChild(renderRefreshBar());
  var c=h("div",{style:{maxWidth:"1200px",margin:"0 auto",padding:"16px"}});
  if(S.tab==="screener")c.appendChild(renderScreener());
  else if(S.tab==="etf")c.appendChild(renderETF());
  else if(S.tab==="prior")c.appendChild(renderPrior());
  else if(S.tab==="strategies")c.appendChild(renderStrat());
  else if(S.tab==="settings")c.appendChild(renderSettings());
  app.appendChild(c);
  app.appendChild(renderFooter());
}

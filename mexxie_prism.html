<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08111b">
<meta name="description" content="Mexxie Ultimate v5 Terminal - Institutional global stock intelligence with dense ranking views">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mexxie Ultimate v5 Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .3s,color .3s;background-attachment:fixed;letter-spacing:.01em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer}
select{font-family:inherit;cursor:pointer}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',monospace}
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{-ms-overflow-style:none;scrollbar-width:none}
.stock-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.hero-card{grid-column:1/-1}
.stock-card{border-radius:14px;padding:16px;transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(12px)}
.stock-card:hover{transform:translateY(-3px)}
.score-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.score-ring-inner{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute}
.exec-summary{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s ease,padding .3s ease}
.exec-summary.open{max-height:900px;opacity:1;padding-top:16px}
.factor-bar{height:8px;border-radius:4px;overflow:hidden;position:relative}
.factor-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.25,.8,.25,1)}
.conviction-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.strength-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12px;line-height:1.5}
.risk-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:11px;line-height:1.5}
.prior-row{display:grid;grid-template-columns:1fr 90px 90px 90px auto;align-items:center;gap:12px}
.etf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.region-bar{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--bdr)}
.region-bar button{flex:1;padding:10px 6px;border:none;font-size:11px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap;letter-spacing:.3px}
.metric-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600}
@media(max-width:900px){
  .stock-cards{grid-template-columns:1fr 1fr}
  .hero-card{grid-column:1/-1}
  .prior-row{grid-template-columns:1fr 70px auto;gap:8px}
  .prior-mid{display:none}
  .etf-grid,.strat-grid{grid-template-columns:1fr}
  .theme-grid{grid-template-columns:1fr}
  .weight-grid{grid-template-columns:1fr}
  .region-bar button{font-size:10px;padding:8px 4px}
}
@media(max-width:600px){
  .stock-cards{grid-template-columns:1fr}
  .hero-card{grid-column:auto}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,0.3)}70%{box-shadow:0 0 0 8px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
.fade-in{animation:fadeIn .3s ease-out both}
.bar-fill{transition:width .5s cubic-bezier(.25,.8,.25,1)}
.refresh-icon{display:inline-block;transition:transform .6s ease}
.v5-shell{
  background:
    radial-gradient(circle at 12% 18%, rgba(40,199,111,0.12), transparent 22%),
    radial-gradient(circle at 88% 12%, rgba(59,130,246,0.14), transparent 18%),
    linear-gradient(180deg, #071018, #0a1521 48%, #08111b 100%);
}
.v5-card-wash::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(148,163,184,0.08), transparent 28%, rgba(15,23,42,0.18));
  pointer-events:none;
}
.terminal-shell .metric-pill{border:1px solid rgba(148,163,184,0.16);background:rgba(15,23,42,0.82)}
.terminal-card{box-shadow:0 8px 24px rgba(2,6,23,0.28)}
.terminal-card .mono{font-family:'JetBrains Mono',monospace;letter-spacing:.03em}
</style>

<script>
// ===================== THEMES =====================
var THEMES={

  amber:{name:"Amber Dusk",bg:"#0f0a05",surface:"#1a1208",card:"#251a0a",border:"#40301a",accent:"#f59e0b",accentGlow:"rgba(245,158,11,0.15)",sell:"#ef4444",sellGlow:"rgba(239,68,68,0.12)",buy:"#84cc16",buyGlow:"rgba(132,204,22,0.12)",text:"#fef3c7",ts:"#fcd34d",tm:"#d97706",grad:"linear-gradient(135deg,#f59e0b,#d97706)",hg:"linear-gradient(135deg,#0f0a05,#1a1508,#0f0a05)",rt:"#40301a",rth:"#f59e0b"},
  neon:{name:"Neon Pulse",bg:"#050010",surface:"#0d0022",card:"#130030",border:"#2d0070",accent:"#d946ef",accentGlow:"rgba(217,70,239,0.18)",sell:"#f43f5e",sellGlow:"rgba(244,63,94,0.14)",buy:"#00ffc8",buyGlow:"rgba(0,255,200,0.12)",text:"#f0e6ff",ts:"#c084fc",tm:"#7c3aed",grad:"linear-gradient(135deg,#d946ef,#7c3aed)",hg:"linear-gradient(135deg,#050010,#130030,#050010)",rt:"#2d0070",rth:"#d946ef"},
  crimson:{name:"Crimson Forge",bg:"#0d0005",surface:"#160008",card:"#20000d",border:"#500020",accent:"#fb7185",accentGlow:"rgba(251,113,133,0.15)",sell:"#ff6b35",sellGlow:"rgba(255,107,53,0.12)",buy:"#4ade80",buyGlow:"rgba(74,222,128,0.12)",text:"#ffe4e6",ts:"#fda4af",tm:"#e11d48",grad:"linear-gradient(135deg,#fb7185,#e11d48)",hg:"linear-gradient(135deg,#0d0005,#200010,#0d0005)",rt:"#500020",rth:"#fb7185"},
  ocean:{name:"Deep Ocean",bg:"#010c18",surface:"#021525",card:"#031d30",border:"#074060",accent:"#38bdf8",accentGlow:"rgba(56,189,248,0.15)",sell:"#f87171",sellGlow:"rgba(248,113,113,0.12)",buy:"#34d399",buyGlow:"rgba(52,211,153,0.12)",text:"#e0f2fe",ts:"#7dd3fc",tm:"#0369a1",grad:"linear-gradient(135deg,#38bdf8,#0284c7)",hg:"linear-gradient(135deg,#010c18,#021f35,#010c18)",rt:"#074060",rth:"#38bdf8"},
  gold:{name:"Pharaoh Gold",bg:"#080600",surface:"#110e00",card:"#1a1500",border:"#3d2f00",accent:"#fbbf24",accentGlow:"rgba(251,191,36,0.18)",sell:"#ef4444",sellGlow:"rgba(239,68,68,0.12)",buy:"#86efac",buyGlow:"rgba(134,239,172,0.12)",text:"#fffbeb",ts:"#fde68a",tm:"#b45309",grad:"linear-gradient(135deg,#fbbf24,#d97706,#b45309)",hg:"linear-gradient(135deg,#080600,#1a1500,#080600)",rt:"#3d2f00",rth:"#fbbf24"}
};
var SECTORS=["Technology","Healthcare","Finance","Consumer","Energy","Industrial","Materials","Utilities","Real Estate","Telecom","Other"];
// ===================== API CONFIGURATION =====================
// Auto-detect: saved URL → localhost:3001 → Railway production (default for GitHub Pages)
var RAILWAY_DEFAULT='https://kubora-production.up.railway.app/api';
var API_BASE=(function(){
  try{var saved=localStorage.getItem('mexxie_api_url');if(saved&&saved.trim())return saved.trim().replace(/\/$/,'')+'/api';}catch(e){}
  var h=window.location.hostname;
  if(h==='localhost'||h==='127.0.0.1')return 'http://localhost:3001/api';
  return RAILWAY_DEFAULT; // GitHub Pages / any non-localhost → always try Railway
})();
var API_AVAILABLE=false;
var COUNTRY_FLAGS={
  "US":"🇺🇸","USA":"🇺🇸","UNITED STATES":"🇺🇸",
  "GB":"🇬🇧","UK":"🇬🇧","UNITED KINGDOM":"🇬🇧","ENGLAND":"🇬🇧",
  "DE":"🇩🇪","GERMANY":"🇩🇪","FR":"🇫🇷","FRANCE":"🇫🇷","CH":"🇨🇭","SWITZERLAND":"🇨🇭",
  "NL":"🇳🇱","NETHERLANDS":"🇳🇱","DK":"🇩🇰","DENMARK":"🇩🇰","ES":"🇪🇸","SPAIN":"🇪🇸",
  "IT":"🇮🇹","ITALY":"🇮🇹","SE":"🇸🇪","SWEDEN":"🇸🇪",
  "CN":"🇨🇳","CHINA":"🇨🇳","HK":"🇭🇰","HONG KONG":"🇭🇰","JP":"🇯🇵","JAPAN":"🇯🇵",
  "KR":"🇰🇷","SOUTH KOREA":"🇰🇷","TW":"🇹🇼","TAIWAN":"🇹🇼","IN":"🇮🇳","INDIA":"🇮🇳",
  "SG":"🇸🇬","SINGAPORE":"🇸🇬","AU":"🇦🇺","AUSTRALIA":"🇦🇺",
  "BR":"🇧🇷","BRAZIL":"🇧🇷","MX":"🇲🇽","MEXICO":"🇲🇽","AR":"🇦🇷","ARGENTINA":"🇦🇷","CL":"🇨🇱","CHILE":"🇨🇱","CO":"🇨🇴","COLOMBIA":"🇨🇴",
  "ZA":"🇿🇦","SOUTH AFRICA":"🇿🇦","NG":"🇳🇬","NIGERIA":"🇳🇬","KE":"🇰🇪","KENYA":"🇰🇪","GH":"🇬🇭","GHANA":"🇬🇭"
};
function normalizeTicker(raw){
  var t=(raw==null?"":String(raw)).trim();
  if(!t)return"";
  return t.toUpperCase().replace(/\s+/g,"");
}
function normalizeSector(raw){
  var s=(raw==null?"":String(raw)).trim();
  if(!s)return"Other";
  var u=s.toUpperCase();
  if(u.indexOf("TECH")>=0||u.indexOf("SOFTWARE")>=0||u.indexOf("SEMICON")>=0)return"Technology";
  if(u.indexOf("HEALTH")>=0||u.indexOf("PHARMA")>=0||u.indexOf("BIOTECH")>=0)return"Healthcare";
  if(u.indexOf("FINAN")>=0||u.indexOf("BANK")>=0||u.indexOf("INSUR")>=0||u.indexOf("CAPITAL")>=0)return"Finance";
  if(u.indexOf("CONSUM")>=0||u.indexOf("RETAIL")>=0||u.indexOf("AUTO")>=0||u.indexOf("MEDIA")>=0||u.indexOf("LEISURE")>=0)return"Consumer";
  if(u.indexOf("ENER")>=0||u.indexOf("OIL")>=0||u.indexOf("GAS")>=0)return"Energy";
  if(u.indexOf("INDUSTR")>=0||u.indexOf("AEROSPACE")>=0||u.indexOf("TRANSPORT")>=0||u.indexOf("LOGISTICS")>=0)return"Industrial";
  if(u.indexOf("MATERIAL")>=0||u.indexOf("MINING")>=0||u.indexOf("CHEM")>=0)return"Materials";
  if(u.indexOf("UTILIT")>=0)return"Utilities";
  if(u.indexOf("REAL")>=0||u.indexOf("REIT")>=0||u.indexOf("PROPERTY")>=0)return"Real Estate";
  if(u.indexOf("TELECOM")>=0||u.indexOf("COMMUNICATION")>=0)return"Telecom";
  return SECTORS.indexOf(s)>=0?s:"Other";
}
function normalizeRegion(raw,country,ticker,exchange){
  var txt=((raw||"")+" "+(country||"")+" "+(exchange||"")+" "+(ticker||"")).toUpperCase();
  if(/UNITED STATES| USA\b|\bUS\b|NASDAQ|NYSE|\.US\b/.test(txt))return"US";
  if(/EUROPE| UNITED KINGDOM| UK\b| ENGLAND| GERMANY| FRANCE| SWITZERLAND| NETHERLANDS| DENMARK| SPAIN| ITALY| SWEDEN| LSE| XETRA|\.PA\b|\.DE\b|\.MC\b|\.L\b|\.LSE\b|\.AS\b|\.SW\b/.test(txt))return"Europe";
  if(/ASIA| CHINA| HONG KONG| JAPAN| SOUTH KOREA| KOREA| TAIWAN| INDIA| SINGAPORE| AUSTRALIA| HKEX| NSE| BSE| TYO| KQ| KS|\.HK\b|\.T\b|\.KS\b|\.KQ\b|\.NS\b|\.AX\b/.test(txt))return"Asia";
  if(/S\. AMERICA|SOUTH AMERICA|LATAM|LATIN| BRAZIL| ARGENTINA| CHILE| COLOMBIA| MEXICO|\.SA\b/.test(txt))return"S. America";
  if(/AFRICA| SOUTH AFRICA| NIGERIA| KENYA| GHANA| JSE|\.JSE\b/.test(txt))return"Africa";
  return"Worldwide";
}
function normalizeMarketCap(raw){
  if(raw==null||raw==="")return 0;
  var n=+raw;
  if(!isFinite(n)||n<=0)return 0;
  if(n>1000000000)return +(n/1e9).toFixed(0);
  if(n>1000000&&n<=1000000000)return +(n/1000).toFixed(0);
  return +n.toFixed(0);
}
function normalizeNumber(raw){
  if(raw==null||raw==="")return null;
  var n=+raw;
  return isFinite(n)?n:null;
}
function normalizePercent(raw){
  var n=normalizeNumber(raw);
  if(n==null)return null;
  if(Math.abs(n)<=1)n=n*100;
  return +n.toFixed(2);
}
function extractRowFundamentals(row){
  var src=(row&&typeof row.fundamentals==="object"&&row.fundamentals)||row||{};
  var fd={};
  function put(key,val){if(val!=null&&!isNaN(val))fd[key]=val}
  put('pe',normalizeNumber(src.pe!=null?src.pe:src.pe_ratio));
  put('pb',normalizeNumber(src.pb!=null?src.pb:src.price_to_book));
  put('dy',normalizePercent(src.dy!=null?src.dy:(src.dividend_yield!=null?src.dividend_yield:src.divYield)));
  put('roa',normalizePercent(src.roa));
  put('roe',normalizePercent(src.roe));
  put('de',normalizeNumber(src.de!=null?src.de:(src.debt_equity!=null?src.debt_equity:src.debtToEquity)));
  put('cr',normalizeNumber(src.cr!=null?src.cr:(src.current_ratio!=null?src.current_ratio:src.currentRatio)));
  put('gm',normalizePercent(src.gm!=null?src.gm:src.gross_margin));
  put('om',normalizePercent(src.om!=null?src.om:src.operating_margin));
  put('nm',normalizePercent(src.nm!=null?src.nm:src.net_margin));
  put('eg',normalizePercent(src.eg!=null?src.eg:src.eps_growth));
  put('eqg',normalizePercent(src.eqg!=null?src.eqg:src.eps_growth_qoq));
  put('sg',normalizePercent(src.sg!=null?src.sg:src.sales_growth));
  put('io',normalizePercent(src.io!=null?src.io:src.insider_ownership));
  return fd;
}
function normalizeStockRecord(row){
  var ticker=normalizeTicker(row.t||row.ticker||row.symbol||row.code);
  if(!ticker)return null;
  var country=(row.country||row.country_name||row.countryCode||row.country_code||"");
  var exchange=(row.exchange||row.primary_exchange||row.market||"");
  var region=normalizeRegion(row.r||row.region,country,ticker,exchange);
  var co=COUNTRY_FLAGS[String(country).trim().toUpperCase()]||COUNTRY_FLAGS[String(row.country_code||"").trim().toUpperCase()]||REGION_MAP[region]||"🌐";
  var mc=normalizeMarketCap(row.mc!=null?row.mc:(row.market_cap_bn!=null?row.market_cap_bn:(row.marketCapBn!=null?row.marketCapBn:(row.market_cap!=null?row.market_cap:row.marketCap))));
  var price=+(row.p!=null?row.p:(row.price!=null?row.price:(row.close!=null?row.close:(row.last_price!=null?row.last_price:0))));
  return{
    t:ticker,
    n:(row.n||row.name||row.company_name||row.company||ticker),
    s:normalizeSector(row.s||row.sector||row.industry_group||row.industry),
    p:isFinite(price)&&price>0?+price:0,
    mc:mc,
    r:region,
    co:row.co||co,
    live:row.live||null,
    fd:extractRowFundamentals(row)
  };
}
function normalizeUniverseRows(rows){
  var out=[];var seen={};
  (rows||[]).forEach(function(row){
    var st=normalizeStockRecord(row);
    if(!st||!st.t||seen[st.t])return;
    seen[st.t]=1;
    out.push(st);
  });
  return out;
}
function normalizeFundamentalMap(map){
  var out={};
  Object.keys(map||{}).forEach(function(k){
    var nk=normalizeTicker(k);
    if(!nk)return;
    out[nk]=map[k];
  });
  return out;
}

async function checkAPI(){
  if(!API_BASE){API_AVAILABLE=false;return;}
  try{var r=await fetch(API_BASE+'/health',{signal:AbortSignal.timeout(3000)});var d=await r.json();API_AVAILABLE=d.status==='ok'||d.status==='degraded';}catch(e){API_AVAILABLE=false;}
}
async function loadStockUniverse(){
  if(!API_AVAILABLE)return;
  try{var r=await fetch(API_BASE+'/stocks?limit=5000');var d=await r.json();
    var normalized=normalizeUniverseRows(d);
    if(normalized&&normalized.length>0){
      ALL_STOCKS=normalized;
      var mergedFund={};
      normalized.forEach(function(st){if(st.fd&&Object.keys(st.fd).length)mergedFund[st.t]=Object.assign({},S.finvizData[st.t]||{},st.fd)});
      if(Object.keys(mergedFund).length){S.finvizData=Object.assign({},S.finvizData,mergedFund);persistFundData();}
      console.log('Loaded '+normalized.length+' normalized stocks from QuestDB');
    }
  }catch(e){console.log('API stock load failed, using fallback');}
}
async function loadPriorPicks(){
  if(!API_AVAILABLE)return;
  try{var r=await fetch(API_BASE+'/picks');var d=await r.json();
    if(d&&d.length>0){S.prior=d;console.log('Loaded '+d.length+' prior picks from QuestDB');}

async function persistScores(){
  if(!API_AVAILABLE)return;
  try{
    var nw2=nW();
    // For large universes only persist stocks with live data (real-time enriched)
    var stocksToPersist=ALL_STOCKS.length>500?ALL_STOCKS.filter(function(st){return !!st.live}):ALL_STOCKS;
    if(stocksToPersist.length===0)return;
    console.log('Persisting scores for '+stocksToPersist.length+'/'+ALL_STOCKS.length+' stocks (live data)');
    var scores=stocksToPersist.map(function(st){var idx=ALL_STOCKS.indexOf(st);var sc=genSc(idx);
      if(st.live){
        if(st.live.pb!=null)sc.t.pb=+Math.abs(st.live.pb).toFixed(2);
        if(st.live.divYield!=null)sc.t.dy=+(st.live.divYield*100).toFixed(1);
        if(st.live.roe!=null){var liveRoe=+st.live.roe;if(!isNaN(liveRoe))sc.g.roic=+(Math.abs(liveRoe)<=5?liveRoe*100:liveRoe).toFixed(1);}
        if(st.live.pe!=null&&st.live.pe>0)sc.g.ey=+(100/st.live.pe).toFixed(1);
        if(st.live.change!=null)sc.s.mom=+Math.min(100,Math.max(0,50+st.live.change*2)).toFixed(0);
        if(st.live.fcfYield!=null&&st.live.fcfYield>0)sc.t.fcf=+Math.min(14,st.live.fcfYield).toFixed(1);
        // EODHD-specific: use EMA-derived momentum if available (more accurate than daily change)
        if(st.live.mom!=null&&st.live.ema200)sc.s.mom=+Math.min(100,Math.max(0,50+st.live.mom*0.5)).toFixed(0);
        // EODHD: use 52-week range position as RSI proxy when real RSI unavailable
        if(st.live.range52!=null&&st.live.ema200)sc.s.rsi=+Math.min(85,Math.max(15,st.live.range52*0.7+15)).toFixed(0);
      }
      var cats=0;
      if(sc.g.ey>10||sc.t.pb<2)cats++;
      if(sc.m.moat>=3&&+sc.m.qual>70)cats++;
      if(+sc.s.mom>55&&+sc.s.rsi>=40&&+sc.s.rsi<=65)cats++;// tightened to match comp() ideal range
      if(sc.p.fscore>=6&&sc.a.z>2)cats++;
      if(+sc.t.shY>5)cats++;
      return{ticker:st.t,sc:sc,comp:+comp(sc,nw2),consensus:cats};
    });
    await fetch(API_BASE+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({dataSeed:S.dataSeed,dataSource:S.lastSource,scores:scores})});
    console.log('Persisted '+scores.length+' scores to QuestDB');
  }catch(e){console.log('Score persist failed:',e.message);}
}
async function persistValuation(mv){
  if(!API_AVAILABLE||!mv)return;
  try{await fetch(API_BASE+'/valuation',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(mv)});}catch(e){}
}
async function persistPick(action,pick,data){
  if(!API_AVAILABLE)return;
  try{
    if(action==='add')await fetch(API_BASE+'/picks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pick)});
    else if(action==='update')await fetch(API_BASE+'/picks/'+pick.t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    else if(action==='delete')await fetch(API_BASE+'/picks/'+pick.t,{method:'DELETE'});
  }catch(e){}
}

function unresolvedTickersForFinnhub(maxSymbols){
  function hasFund(st){return !!(st.live&&(st.live.pe!=null||st.live.pb!=null||st.live.roe!=null||st.live.fcfYield!=null||st.live.debtEquity!=null))}
  function suffixOf(t){var i=t.lastIndexOf('.');return i>=0?t.substring(i+1).toUpperCase():''}
  function canLikelyResolve(st){
    var t=normalizeTicker(st.t),sfx=suffixOf(t);
    return !!(FMP_TICKERS[t]||!sfx||/^(L|PA|DE|MC|AS|SW|NS|AX|HK|JO|KS|KQ|T)$/.test(sfx));
  }
  function priority(st){
    var t=normalizeTicker(st.t),sfx=suffixOf(t),score=0;
    if(FMP_TICKERS[t])score+=120;
    if(!sfx)score+=90;
    if(/^(L|PA|DE|MC|AS|SW|NS|AX|HK|JO|KS|KQ|T)$/.test(sfx))score+=35;
    if(st.mc>0)score+=20;
    if(st.s&&st.s!=='Unknown'&&st.s!=='Other')score+=10;
    if(st.r==='US')score+=18;
    else if(st.r==='Europe')score+=12;
    else if(st.r==='Asia')score+=6;
    return score;
  }
  return ALL_STOCKS.filter(function(st){return !hasFund(st)&&canLikelyResolve(st)}).sort(function(a,b){return priority(b)-priority(a)||a.t.localeCompare(b.t)}).slice(0,maxSymbols||180).map(function(st){return normalizeTicker(st.t)});
}

function parseFinvizCSV(text){
  var lines=text.trim().split('\n');
  if(lines.length<2)return{count:0,data:{}};
  var header=lines[0].replace(/\r/g,'').split(',').map(function(h){return h.replace(/"/g,'').trim()});
  function col(n){return header.indexOf(n)}
  var iT=col('Ticker'),iPE=col('P/E'),iPB=col('P/B');
  var iDY=col('Dividend %');if(iDY<0)iDY=col('Dividend Yield');
  var iROA=col('Return on Assets'),iROE=col('Return on Equity');
  var iDE=col('Total Debt/Equity'),iCR=col('Current Ratio');
  var iGM=col('Gross Margin'),iOM=col('Operating Margin'),iNM=col('Net Profit Margin');
  var iEG=col('EPS growth this Y'),iEQG=col('EPS growth qtr over qtr');
  var iSG=col('Sales growth past 5Y'),iSI=col('Float Short'),iIO=col('Insider Ownership');
  function pn(v){
    if(!v||v==='-'||v==='')return null;
    var n=parseFloat(v.replace(/"/g,'').trim().replace('%','').replace(/,/g,''));
    return isNaN(n)?null:n;
  }
  function splitRow(row){
    var cols=[],cur='',inQ=false;
    for(var c=0;c<row.length;c++){
      if(row[c]==='"')inQ=!inQ;
      else if(row[c]===','&&!inQ){cols.push(cur);cur='';}
      else cur+=row[c];
    }
    cols.push(cur);return cols;
  }
  var data={},count=0;
  for(var i=1;i<lines.length;i++){
    var row=lines[i].replace(/\r/g,'');if(!row.trim())continue;
    var cols=splitRow(row);
    if(iT<0||cols.length<=iT)continue;
    var ticker=cols[iT].replace(/"/g,'').trim();
    if(!ticker||ticker==='Ticker')continue;
    data[ticker]={
      pe:pn(cols[iPE]),pb:pn(cols[iPB]),dy:pn(cols[iDY]),
      roa:pn(cols[iROA]),roe:pn(cols[iROE]),
      de:pn(cols[iDE]),cr:pn(cols[iCR]),
      gm:pn(cols[iGM]),om:pn(cols[iOM]),nm:pn(cols[iNM]),
      eg:pn(cols[iEG]),eqg:pn(cols[iEQG]),sg:pn(cols[iSG]),
      si:pn(cols[iSI]),io:pn(cols[iIO])
    };
    count++;
  }
  return{count:count,data:data};
}
function applyFinvizData(sc,ticker){
  var fd=S.finvizData[normalizeTicker(ticker)];if(!fd)return;
  // Earnings yield from real PE
  if(fd.pe!=null){if(fd.pe>0)sc.g.ey=+Math.min(25,100/fd.pe).toFixed(1);else sc.g.ey=0;}
  // Finviz shows "-" (null) for PE when company is loss-making — detect via ROA or net margin
  if(fd.pe==null&&((fd.roa!=null&&fd.roa<0)||(fd.nm!=null&&fd.nm<0)))sc.g.ey=0;
  // ROE adjusted for financial leverage → better ROIC proxy
  // High ROE from excessive debt masks poor operations (DuPont decomposition)
  // Adjustment: effective return ≈ ROE / (1 + clamped_DE) — capped D/E at 3 to prevent over-penalising stable leveraged businesses
  if(fd.roe!=null){
    var adjRoe=fd.roe;
    if(fd.de!=null&&fd.de>0)adjRoe=fd.roe/(1+Math.min(fd.de,3));
    sc.g.roic=+Math.min(48,Math.max(0,adjRoe)).toFixed(1);
  }
  // Price/Book
  if(fd.pb!=null&&fd.pb>0)sc.t.pb=+Math.min(4,fd.pb).toFixed(2);
  // Dividend yield
  if(fd.dy!=null&&fd.dy>=0)sc.t.dy=+Math.min(15,fd.dy).toFixed(1);
  // Insider ownership >10% = significant
  if(fd.io!=null)sc.t.ins=fd.io>10;
  // Short interest
  if(fd.si!=null)sc.s.shortInt=+Math.abs(fd.si).toFixed(1);
  // Quality score from net profit margin: -50%=20, 0%=50, 20%+=100
  if(fd.nm!=null)sc.m.qual=+Math.min(100,Math.max(20,50+fd.nm*2.5)).toFixed(0);
  // Revenue quality from average of EPS growth + sales growth
  // Scale: 0%=3 (below neutral), 20%=4, 80%=8 — negative growth penalised below 3
  // The previous floor of 4 was too generous for flat/declining businesses
  if(fd.eg!=null||fd.sg!=null){
    var both=fd.eg!=null&&fd.sg!=null;
    var avgG=((fd.eg||0)+(fd.sg||0))/(both?2:1);
    // Neutral at 20% growth (typical healthy mid-cap); ±10% per 10pp of growth deviation
    sc.m.revQ=+Math.min(8,Math.max(0,3+avgG*0.06)).toFixed(1);
  }
  // Piotroski: override 6 of 9 components with real data
  if(fd.roa!=null)sc.p.pf.roa=fd.roa>0;
  if(fd.om!=null)sc.p.pf.cfo=fd.om>0;        // positive op margin → positive CFO proxy
  if(fd.eqg!=null)sc.p.pf.droa=fd.eqg>0;     // EPS growth QoQ → improving ROA proxy
  if(fd.de!=null)sc.p.pf.dlev=fd.de<1.5;
  if(fd.cr!=null)sc.p.pf.dliq=fd.cr>1;
  if(fd.gm!=null)sc.p.pf.dmargin=fd.gm>0;
  sc.p.fscore=Object.values(sc.p.pf).filter(Boolean).length;
  // Altman Z: if confirmed loss-maker, cap at grey zone
  if(fd.pe!=null&&fd.pe<=0){sc.a.z=Math.min(sc.a.z,2.5);sc.a.safe=false;sc.a.grey=sc.a.z>=1.81;sc.a.distress=sc.a.z<1.81;}
}

function liveToStoredFund(st){

function u8ToB64(bytes){var bin="";bytes.forEach(function(b){bin+=String.fromCharCode(b)});return btoa(bin)}
function b64ToU8(str){var bin=atob(str),out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function deriveVaultKey(pass,salt){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:210000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}

async function encryptKeyVault(payload,pass){
  var salt=crypto.getRandomValues(new Uint8Array(16));var iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await deriveVaultKey(pass,salt);
  var enc=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(JSON.stringify(payload)));
  return {v:1,alg:"AES-GCM",kdf:"PBKDF2-SHA256",iterations:210000,salt:u8ToB64(salt),iv:u8ToB64(iv),ciphertext:u8ToB64(new Uint8Array(enc))};
}
async function decryptKeyVault(vault,pass){
  var salt=b64ToU8(vault.salt),iv=b64ToU8(vault.iv),cipher=b64ToU8(vault.ciphertext);
  var key=await deriveVaultKey(pass,salt);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,cipher);
  return JSON.parse(new TextDecoder().decode(plain));
}

function factorRating(val,thresholds){
  if(val>=thresholds[0])return{label:"Strong",color:"buy"};

  if(val>=thresholds[2])return{label:"Fair",color:"tm"};

}

// ======= TAX-AWARE RECOMMENDATION ENGINE =======
function priorRec(pk){
  var now=new Date();
  var picked=new Date(pk.date);
  // Bug fix: clamp to 0 — future-dated picks would produce negative daysHeld
  var daysHeld=Math.max(0,Math.floor((now-picked)/(1000*60*60*24)));
  var isLTCG=daysHeld>=365;
  var daysToLTCG=isLTCG?0:Math.max(0,365-daysHeld);
  var pct=((pk.curr-pk.entry)/pk.entry*100);
  var gain=pct>=0;
  var nw2=nW();
  var stObj=ALL_STOCKS.find(function(s){return s.t===pk.t});
  var score=0;
  if(stObj){
    var idx=ALL_STOCKS.indexOf(stObj);if(idx<0)idx=ALL_STOCKS.findIndex(function(s){return s.t===stObj.t});
    var sc=genSc(idx);
    if(stObj.live){
      if(stObj.live.pb!=null)sc.t.pb=+Math.abs(stObj.live.pb).toFixed(2);
      if(stObj.live.divYield!=null)sc.t.dy=+(stObj.live.divYield*100).toFixed(1);
      if(stObj.live.roe!=null)sc.g.roic=+(stObj.live.roe*100).toFixed(1);
      // Bug fix: negative P/E → EY=0 not simulated value
      if(stObj.live.pe!=null){if(stObj.live.pe>0)sc.g.ey=+(100/stObj.live.pe).toFixed(1);else sc.g.ey=0;}
      if(stObj.live.change!=null)sc.s.mom=+Math.min(100,Math.max(0,50+stObj.live.change*2)).toFixed(0);
      if(stObj.live.fcfYield!=null&&stObj.live.fcfYield>0)sc.t.fcf=+Math.min(14,stObj.live.fcfYield).toFixed(1);
    }
    score=+comp(sc,nw2);
  }
  var rec="HOLD";var reason="";var taxNote="";
  var stRate="22\u201337%";var ltRate="0\u201320%";
  if(gain){
    if(!isLTCG&&daysToLTCG<=90){rec="HOLD";reason="Only "+daysToLTCG+" days to LTCG qualification. Hold for lower tax rate.";taxNote="Short-term rate: "+stRate+" \u2192 Long-term rate: "+ltRate;}
    else if(!isLTCG&&pct>25){rec="HOLD";reason="Strong gain (+"+pct.toFixed(1)+"%) but short-term tax applies. Hold for LTCG.";taxNote="Selling now: "+stRate+" tax on $"+(pk.curr-pk.entry).toFixed(2)+" gain per share";}
    else if(isLTCG&&score<40&&pct>40){rec="SELL";reason="LTCG qualified. Score below 40 = weakening fundamentals. Take profits.";taxNote="Favorable "+ltRate+" long-term rate applies";}
    else if(isLTCG&&pct>60){rec="SELL";reason="LTCG qualified with +"+pct.toFixed(1)+"% gain. Consider partial profit-taking.";taxNote="Favorable "+ltRate+" long-term rate applies";}
    else if(score>=60){rec="BUY";reason="Score "+score.toFixed(0)+"/100 = strong fundamentals. Add to position.";taxNote=isLTCG?"LTCG qualified":"Short-term holding ("+daysHeld+" days)";}
    else{rec="HOLD";reason=score>=45?"Solid score ("+score.toFixed(0)+"). Fundamentals intact.":"Monitor \u2014 score at "+score.toFixed(0)+". Watch for deterioration.";taxNote=isLTCG?"LTCG qualified \u2014 "+ltRate+" on exit":(daysToLTCG+" days to LTCG qualification");}
  }else{
    if(!isLTCG&&pct<-10){rec="SELL";reason="Tax-loss harvest: short-term loss of "+pct.toFixed(1)+"% offsets gains at "+stRate+".";taxNote="Wash sale rule: cannot rebuy same stock within 30 days";}
    else if(isLTCG&&pct<-15){rec="SELL";reason="Long-term loss. Harvest to offset capital gains. Consider redeploying capital.";taxNote="Can offset LTCG or up to $3,000 ordinary income/year";}
    else if(pct<-25){rec="SELL";reason="Significant loss ("+pct.toFixed(1)+"%). Cut losses and reallocate.";taxNote=isLTCG?"Long-term loss deductible":"Short-term loss \u2014 higher deduction value";}
    else if(score>=55&&pct>-10){rec="BUY";reason="Score "+score.toFixed(0)+" is solid. Minor dip may be buying opportunity.";taxNote=isLTCG?"LTCG qualified":(daysHeld+" days held");}
    else{rec="HOLD";reason="Minor drawdown ("+pct.toFixed(1)+"%). Score: "+score.toFixed(0)+". Monitor recovery.";taxNote=isLTCG?"LTCG qualified":(daysToLTCG+" days to LTCG");}
  }

function render(){
  var t=T();
  document.body.style.background=t.bg;document.body.style.color=t.text;
  var ds=document.getElementById("ds");
  if(!ds){ds=document.createElement("style");ds.id="ds";document.head.appendChild(ds)}

function renderFatalError(err){

  if(!app)return;
  var msg=err&&err.message?err.message:String(err||"Unknown error");
  app.innerHTML="<div style='max-width:780px;margin:40px auto;padding:20px;border-radius:12px;border:1px solid #ef444488;background:#2a0f14;color:#fecaca;font-family:DM Sans,Segoe UI,sans-serif'><div style='font-size:18px;font-weight:700;margin-bottom:6px'>Mexxie Ultimate v5 Terminal hit a startup error</div><div style='font-size:13px;line-height:1.6'>The app could not finish loading. Reload the page. If this persists, clear site data in browser settings.</div><div style='margin-top:12px;font-family:JetBrains Mono,monospace;font-size:12px;background:#12070a;padding:10px;border-radius:8px;word-break:break-word'>"+msg+"</div></div>";
}

// ===== ASYNC STARTUP =====
(async function startup(){

    if(API_AVAILABLE){
      await Promise.all([loadStockUniverse(),loadPriorPicks()]);

      fetchMarketValuation(false).then(function(r){if(r){S.marketVal=r;persistValuation(r);render()}});
    }

window.addEventListener("error",function(ev){
  console.error("Unhandled error:",ev.error||ev.message);

});
window.addEventListener("unhandledrejection",function(ev){

});

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .3s,color .3s}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer}
select{font-family:inherit;cursor:pointer}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mono{font-family:'IBM Plex Mono',monospace}
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{-ms-overflow-style:none;scrollbar-width:none}
.stock-row{display:grid;grid-template-columns:36px 1.4fr 1fr 1fr 1fr 1fr 70px;align-items:center;gap:12px}
.prior-row{display:grid;grid-template-columns:1fr 90px 90px 90px auto;align-items:center;gap:12px}
.etf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.weight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.region-bar{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--bdr)}
.region-bar button{flex:1;padding:8px 6px;border:none;font-size:11px;font-weight:600;font-family:inherit;transition:all .2s;white-space:nowrap;letter-spacing:.3px}
@media(max-width:900px){
  .stock-row{grid-template-columns:30px 1fr 70px;gap:8px}
  .stock-details{display:none}
  .prior-row{grid-template-columns:1fr 70px auto;gap:8px}
  .prior-mid{display:none}
  .etf-grid,.strat-grid{grid-template-columns:1fr}
  .theme-grid{grid-template-columns:1fr}
  .weight-grid{grid-template-columns:1fr}
  .region-bar button{font-size:10px;padding:7px 4px}
}
@media(max-width:500px){
  .picks-btns{flex-direction:column;align-items:stretch}
  .picks-btns button{width:100%}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease-out both}
.bar-fill{transition:width .5s cubic-bezier(.25,.8,.25,1)}
.refresh-icon{display:inline-block;transition:transform .6s ease}
</style>
</head>

  var si=sc.s.shortInt;
  var shortScore=(si>=5&&si<=15)?0.7:(si<5)?0.5:(si>20)?0.2:0.4;
  var wt=w.greenblatt||0,wv=w.tweedy||0,wm=w.munger||0,ws=w.simons||0;
  var wp=w.piotroski||0,wa=w.altman||0,wr=w.rsi||0,we=w.evEbit||0;
  var wsh=w.shYield||0,wrev=w.revGrowth||0,wsi=w.shortInt||0;
  var tot=wt+wv+wm+ws+wp+wa+wr+we+wsh+wrev+wsi||1;
  return+((g*(wt/tot)+tv*(wv/tot)+m*(wm/tot)+s2*(ws/tot)+
           p*(wp/tot)+az*(wa/tot)+rsiScore*(wr/tot)+
           Math.max(0,(25-sc.g.evEbit)/25)*(we/tot)+
           (sc.t.shY/15)*(wsh/tot)+(sc.m.revQ/8)*(wrev/tot)+
           shortScore*(wsi/tot))*100).toFixed(1);
}
function nW(){
  var w=S.weights;
  var tot=(w.greenblatt||0)+(w.tweedy||0)+(w.munger||0)+(w.simons||0)+
          (w.piotroski||0)+(w.altman||0)+(w.rsi||0)+(w.evEbit||0)+
          (w.shYield||0)+(w.revGrowth||0)+(w.shortInt||0)||1;
  return{greenblatt:(w.greenblatt||0)/tot,tweedy:(w.tweedy||0)/tot,
         munger:(w.munger||0)/tot,simons:(w.simons||0)/tot,
         piotroski:(w.piotroski||0)/tot,altman:(w.altman||0)/tot,
         rsi:(w.rsi||0)/tot,evEbit:(w.evEbit||0)/tot,
         shYield:(w.shYield||0)/tot,revGrowth:(w.revGrowth||0)/tot,
         shortInt:(w.shortInt||0)/tot};
}

function etfSc(e){
  var base=S.dataSeed||1;
  var jitter=(sR(base+e.t.charCodeAt(0))*4)-2;
  var adjMom=Math.max(-5,e.mom+jitter);
  return+((Math.max(0,100-e.exp*80)*0.2)+(adjMom/30*40)+(e.y/4*30)).toFixed(1);
}
function refreshData(){
  S.dataSeed=Math.floor(Math.random()*90000)+10000;

  render();
}

function batchArray(arr,size){var r=[];for(var i=0;i<arr.length;i+=size)r.push(arr.slice(i,i+size));return r}

async function fetchFMPLive(){
  var key=S.apiKey;
  if(!key){alert("Please enter your FMP API key in Settings first.");S.tab="settings";render();return}

  S.loading=true;S.loadingMsg="Fetching live quotes...";render();

  // Load cached ratios from localStorage (24hr TTL)
  var ratiosCache={};
  var cacheUsed=0;
  try{
    var cached=JSON.parse(localStorage.getItem("mexxie_ratios_cache"));
    if(cached&&cached.ts&&(Date.now()-cached.ts)<24*60*60*1000){
      ratiosCache=cached.data||{};
      cacheUsed=Object.keys(ratiosCache).length;
    }
  }catch(e){/* ignore */}

  var allTickers=ALL_STOCKS.map(function(s){return fmpTicker(s.t)});
  var etfTickers=ETFS.map(function(e){return e.t});
  var allToFetch=allTickers.concat(etfTickers);
  var batches=batchArray(allToFetch,5);

  var quoteMap={};
  var callCount=0;
  var errors=[];

  try{
    if(cacheUsed>0){
      S.loadingMsg="Loaded "+cacheUsed+" cached fundamentals. Fetching quotes...";render();
    }

    // Fetch quotes individually (FMP stable API - free tier requires single-symbol calls)
    for(var b=0;b<batches.length;b++){
      var batch=batches[b];
      S.loadingMsg="Fetching quotes "+(b*5+1)+"-"+Math.min((b+1)*5,allToFetch.length)+"/"+allToFetch.length+"...";render();
      try{
        var results=await Promise.all(batch.map(function(ticker){
          callCount++;
          return fetch(FMP_BASE+"/quote?symbol="+encodeURIComponent(ticker)+"&apikey="+key)
            .then(function(r){return r.ok?r.json():null})
            .catch(function(){return null});
        }));
        for(var r=0;r<results.length;r++){
          var data=results[r];
          if(data&&Array.isArray(data)&&data[0]){
            var q=data[0];
            quoteMap[q.symbol]={price:q.price,change:q.changePercentage,mc:q.marketCap,vol:q.volume,name:q.name};
          }else if(data&&(data["Error Message"]||data.message)){
            errors.push("API: "+(data["Error Message"]||data.message));break;
          }
        }
      }catch(e){errors.push("Quotes "+(b*5+1)+"-"+Math.min((b+1)*5,allToFetch.length)+": "+e.message)}
      if(b<batches.length-1)await new Promise(function(r){setTimeout(r,200)});
    }

    // Determine which stock tickers got valid quotes and need ratios
    var stockTickersWithQuotes=[];
    ALL_STOCKS.forEach(function(s){
      var sym=fmpTicker(s.t);
      if(quoteMap[sym]&&quoteMap[sym].price)stockTickersWithQuotes.push(sym);
    });

    // Only fetch ratios for stocks NOT already in cache
    var tickersNeedingRatios=stockTickersWithQuotes.filter(function(tk){return !ratiosCache[tk]});

    // Fetch ratios-ttm for ALL stocks with valid quotes (not just top 20)
    // ROE computed via DuPont: netProfitMargin x assetTurnover x financialLeverage
    if(tickersNeedingRatios.length>0){
      var ratioBatches=batchArray(tickersNeedingRatios,3);
      for(var i=0;i<ratioBatches.length;i++){
        if(callCount>=245){errors.push("Stopped at "+callCount+" API calls (near 250 daily limit)");break}
        var rBatch=ratioBatches[i];
        S.loadingMsg="Fetching fundamentals "+(i*3+1)+"-"+Math.min((i+1)*3,tickersNeedingRatios.length)+"/"+tickersNeedingRatios.length+"...";render();
        try{
          var rResults=await Promise.all(rBatch.map(function(tk){
            callCount++;
            return fetch(FMP_BASE+"/ratios-ttm?symbol="+encodeURIComponent(tk)+"&apikey="+key)
              .then(function(r){return r.ok?r.json():null})
              .catch(function(){return null});
          }));
          for(var j=0;j<rResults.length;j++){
            var rd=rResults[j];
            if(rd&&Array.isArray(rd)&&rd[0]){
              var d=rd[0];
              var sym2=rBatch[j];
              ratiosCache[sym2]={
                pb:d.priceToBookRatioTTM,
                pe:d.priceToEarningsRatioTTM,
                divYield:d.dividendYieldTTM,
                fcfYield:d.freeCashFlowPerShareTTM,
                debtEquity:d.debtToEquityRatioTTM,
                roe:(d.netProfitMarginTTM&&d.assetTurnoverTTM&&d.financialLeverageRatioTTM)?
                  d.netProfitMarginTTM*d.assetTurnoverTTM*d.financialLeverageRatioTTM:null
              };
            }
          }
        }catch(e){/* skip batch failures */}
        if(i<ratioBatches.length-1)await new Promise(function(r){setTimeout(r,150)});
      }
    }

    // Save ratios cache to localStorage
    try{localStorage.setItem("mexxie_ratios_cache",JSON.stringify({ts:Date.now(),data:ratiosCache}))}catch(e){/* ignore */}

    // Merge cached ratios into quoteMap
    Object.keys(ratiosCache).forEach(function(tk){
      if(!quoteMap[tk])quoteMap[tk]={};
      var cr=ratiosCache[tk];
      if(cr){
        quoteMap[tk].pb=cr.pb;quoteMap[tk].pe=cr.pe;
        quoteMap[tk].divYield=cr.divYield;quoteMap[tk].fcfYield=cr.fcfYield;
        quoteMap[tk].debtEquity=cr.debtEquity;quoteMap[tk].roe=cr.roe;
      }
    });

    // Apply fetched data back to our stock array
    ALL_STOCKS.forEach(function(st){
      var sym=fmpTicker(st.t);
      var q=quoteMap[sym];
      if(q){
        if(q.price)st.p=+q.price.toFixed(2);
        if(q.mc)st.mc=+(q.mc/1e9).toFixed(0);
        if(q.name&&q.name.length>2)st.n=q.name;
        st.live={pb:q.pb,roe:q.roe,divYield:q.divYield,fcfYield:q.fcfYield,pe:q.pe,change:q.change,debtEquity:q.debtEquity};
      }
    });

    // Apply ETF data
    ETFS.forEach(function(etf){
      var q=quoteMap[etf.t];
      if(q){
        if(q.change!=null)etf.mom=+q.change.toFixed(1);
        if(q.price)etf.lastPrice=q.price;
      }
    });

    // Update prior picks
    S.prior.forEach(function(pk){
      var sym=fmpTicker(pk.t);
      var q=quoteMap[sym];
      if(q&&q.price)pk.curr=+q.price.toFixed(2);
    });

    S.dataSeed=Math.floor(Math.random()*90000)+10000;
    S.lastRefresh=new Date();
    S.refreshCount=(S.refreshCount||0)+1;
    S.lastSource="FMP Live";
    S.lastCalls=callCount;
    S.lastErrors=errors;

  }catch(e){
    errors.push("Fatal: "+e.message);
    S.lastErrors=errors;
  }

  S.loading=false;S.loadingMsg="";
  render();
}

async function fetchFinnhubLive(){
  var key=S.finnhubKey;
  if(!key){alert("Please enter your Finnhub API key in Settings first.\n\nGet a free key at: finnhub.io/register");S.tab="settings";render();return}

  S.loading=true;S.loadingMsg="Connecting to Finnhub...";render();

  // Load cached metrics from localStorage (24hr TTL)
  var metricsCache={};
  var cacheUsed=0;
  try{
    var cached=JSON.parse(localStorage.getItem("mexxie_finnhub_cache"));
    if(cached&&cached.ts&&(Date.now()-cached.ts)<24*60*60*1000){
      metricsCache=cached.data||{};
      cacheUsed=Object.keys(metricsCache).length;
    }
  }catch(e){/* ignore */}

  var allTickers=ALL_STOCKS.map(function(s){return fmpTicker(s.t)});
  var etfTickers=ETFS.map(function(e){return e.t});
  var allToFetch=allTickers.concat(etfTickers);

  var quoteMap={};
  var callCount=0;
  var errors=[];
  var rateWindow=[];

  // Rate-limited fetch: stay under 60 calls/min
  async function rateFetch(url){
    var now=Date.now();
    rateWindow=rateWindow.filter(function(ts){return now-ts<60000});
    if(rateWindow.length>=55){
      var waitMs=60000-(now-rateWindow[0])+200;
      S.loadingMsg="Rate limit pause ("+Math.ceil(waitMs/1000)+"s)...";render();
      await new Promise(function(r){setTimeout(r,waitMs)});
    }
    rateWindow.push(Date.now());
    callCount++;
    return fetch(url).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
  }

  try{
    if(cacheUsed>0){
      S.loadingMsg="Loaded "+cacheUsed+" cached fundamentals. Fetching quotes...";render();
    }

    // Phase 1: Fetch quotes for all tickers (price + daily change)
    var quoteBatches=batchArray(allToFetch,5);
    for(var b=0;b<quoteBatches.length;b++){
      var batch=quoteBatches[b];
      S.loadingMsg="Fetching quotes "+(b*5+1)+"-"+Math.min((b+1)*5,allToFetch.length)+"/"+allToFetch.length+"...";render();
      try{
        var results=await Promise.all(batch.map(function(ticker){
          return rateFetch(FINNHUB_BASE+"/quote?symbol="+encodeURIComponent(ticker)+"&token="+key);
        }));
        for(var r=0;r<results.length;r++){
          var data=results[r];
          var ticker=batch[r];
          if(data&&data.c&&data.c>0){
            quoteMap[ticker]={price:data.c,change:data.dp};
          }else if(data&&data.error){
            errors.push(ticker+": "+data.error);
          }
        }
      }catch(e){errors.push("Quote batch error: "+e.message)}
    }

    // Phase 2: Fetch metrics for stocks with valid quotes (skip ETFs)
    var stockTickersWithQuotes=[];
    ALL_STOCKS.forEach(function(s){
      var sym=fmpTicker(s.t);
      if(quoteMap[sym]&&quoteMap[sym].price)stockTickersWithQuotes.push(sym);
    });

    var tickersNeedingMetrics=stockTickersWithQuotes.filter(function(tk){return !metricsCache[tk]});

    if(tickersNeedingMetrics.length>0){
      var metricBatches=batchArray(tickersNeedingMetrics,5);
      for(var i=0;i<metricBatches.length;i++){
        var mBatch=metricBatches[i];
        S.loadingMsg="Fetching fundamentals "+(i*5+1)+"-"+Math.min((i+1)*5,tickersNeedingMetrics.length)+"/"+tickersNeedingMetrics.length+"...";render();
        try{
          var mResults=await Promise.all(mBatch.map(function(tk){
            return rateFetch(FINNHUB_BASE+"/stock/metric?symbol="+encodeURIComponent(tk)+"&metric=all&token="+key);
          }));
          for(var j=0;j<mResults.length;j++){
            var md=mResults[j];
            var sym2=mBatch[j];
            if(md&&md.metric){
              var m=md.metric;
              metricsCache[sym2]={
                pe:m.peBasicExclExtraTTM||m.peNormalizedAnnual||null,
                pb:m.pbQuarterly||m.pbAnnual||null,
                roe:m.roeRfy||m.roeTTM||null,
                divYield:m.dividendYieldIndicatedAnnual||m.currentDividendYieldTTM||null,
                fcfYield:m.freeCashFlowPerShareTTM||null,
                debtEquity:m["totalDebt/totalEquityQuarterly"]||m["totalDebt/totalEquityAnnual"]||null,
                mc:m.marketCapitalization||null
              };
            }
          }
        }catch(e){/* skip batch failures */}
      }
    }

    // Save metrics cache
    try{localStorage.setItem("mexxie_finnhub_cache",JSON.stringify({ts:Date.now(),data:metricsCache}))}catch(e){}

    // Merge cached metrics into quoteMap
    Object.keys(metricsCache).forEach(function(tk){
      if(!quoteMap[tk])quoteMap[tk]={};
      var cr=metricsCache[tk];
      if(cr){
        quoteMap[tk].pb=cr.pb;quoteMap[tk].pe=cr.pe;
        quoteMap[tk].divYield=cr.divYield;quoteMap[tk].fcfYield=cr.fcfYield;
        quoteMap[tk].debtEquity=cr.debtEquity;quoteMap[tk].roe=cr.roe;
        if(cr.mc)quoteMap[tk].mc=cr.mc;
      }
    });

    // Apply fetched data to stocks
    ALL_STOCKS.forEach(function(st){
      var sym=fmpTicker(st.t);
      var q=quoteMap[sym];
      if(q){
        if(q.price)st.p=+q.price.toFixed(2);

    });

    // Apply ETF data

      var q=quoteMap[etf.t];
      if(q){
        if(q.change!=null)etf.mom=+q.change.toFixed(1);
        if(q.price)etf.lastPrice=q.price;
      }
    });

    // Update prior picks
    S.prior.forEach(function(pk){
      var sym=fmpTicker(pk.t);
      var q=quoteMap[sym];
      if(q&&q.price)pk.curr=+q.price.toFixed(2);
    });

    S.dataSeed=Math.floor(Math.random()*90000)+10000;
    S.lastRefresh=new Date();
    S.refreshCount=(S.refreshCount||0)+1;
    S.lastSource="Finnhub Live";
    S.lastCalls=callCount;
    S.lastErrors=errors;

  }catch(e){
    errors.push("Fatal: "+e.message);
    S.lastErrors=errors;
  }

  S.loading=false;S.loadingMsg="";
  render();
}

function priorRec(pk){
  var now=new Date();
  var picked=new Date(pk.date);
  var daysHeld=Math.floor((now-picked)/(1000*60*60*24));
  var isLTCG=daysHeld>=365;
  var daysToLTCG=isLTCG?0:Math.max(0,365-daysHeld);
  var pct=((pk.curr-pk.entry)/pk.entry*100);
  var gain=pct>=0;

  // Find stock score from screener
  var nw=nW();
  var stObj=ALL_STOCKS.find(function(s){return s.t===pk.t});
  var score=0;
  if(stObj){
    var idx=ALL_STOCKS.indexOf(stObj);
    var sc=genSc(idx);
    if(stObj.live){
      if(stObj.live.pb!=null)sc.t.pb=+Math.abs(stObj.live.pb).toFixed(2);
      if(stObj.live.divYield!=null)sc.t.dy=+(stObj.live.divYield*100).toFixed(1);
      if(stObj.live.roe!=null)sc.g.roic=+(stObj.live.roe*100).toFixed(1);
      if(stObj.live.pe!=null&&stObj.live.pe>0)sc.g.ey=+(100/stObj.live.pe).toFixed(1);
      if(stObj.live.change!=null)sc.s.mom=+Math.min(100,Math.max(0,50+stObj.live.change*2)).toFixed(0);
      if(stObj.live.fcfYield!=null&&stObj.live.fcfYield>0)sc.t.fcf=+Math.min(14,stObj.live.fcfYield).toFixed(1);
    }
    score=+comp(sc,nw);
  }

  var rec="HOLD";var reason="";var taxNote="";

  // Tax bracket context
  var stRate="22\u201337%";var ltRate="0\u201320%";

  if(gain){
    if(!isLTCG&&daysToLTCG<=90){
      rec="HOLD";
      reason="Only "+daysToLTCG+" days to LTCG qualification. Hold for lower tax rate.";
      taxNote="Short-term rate: "+stRate+" \u2192 Long-term rate: "+ltRate;
    }else if(!isLTCG&&pct>25){
      rec="HOLD";
      reason="Strong gain (+"+pct.toFixed(1)+"%) but short-term tax applies. Hold for LTCG.";
      taxNote="Selling now: "+stRate+" tax on $"+(pk.curr-pk.entry).toFixed(2)+" gain per share";
    }else if(isLTCG&&score<40&&pct>40){
      rec="SELL";
      reason="LTCG qualified. Score below 40 = weakening fundamentals. Take profits.";
      taxNote="Favorable "+ltRate+" long-term rate applies";
    }else if(isLTCG&&pct>60){
      rec="SELL";
      reason="LTCG qualified with +"+pct.toFixed(1)+"% gain. Consider partial profit-taking.";
      taxNote="Favorable "+ltRate+" long-term rate applies";
    }else if(score>=60){
      rec="BUY";
      reason="Score "+score.toFixed(0)+"/100 = strong fundamentals. Add to position.";
      taxNote=isLTCG?"LTCG qualified":"Short-term holding ("+daysHeld+" days)";
    }else{
      rec="HOLD";
      reason=score>=45?"Solid score ("+score.toFixed(0)+"). Fundamentals intact.":"Monitor \u2014 score at "+score.toFixed(0)+". Watch for deterioration.";
      taxNote=isLTCG?"LTCG qualified \u2014 "+ltRate+" on exit":(daysToLTCG+" days to LTCG qualification");
    }
  }else{
    // Losing position
    if(!isLTCG&&pct<-10){
      rec="SELL";
      reason="Tax-loss harvest: short-term loss of "+pct.toFixed(1)+"% offsets gains at "+stRate+".";
      taxNote="Wash sale rule: cannot rebuy same stock within 30 days";
    }else if(isLTCG&&pct<-15){
      rec="SELL";
      reason="Long-term loss. Harvest to offset capital gains. Consider redeploying capital.";
      taxNote="Can offset LTCG or up to $3,000 ordinary income/year";
    }else if(pct<-25){

    [tm.accent,tm.buy,tm.sell,tm.ts].forEach(function(c){cols.appendChild(h("div",{style:{width:"16px",height:"6px",borderRadius:"2px",background:c}}))});
    btn.appendChild(cols);tg.appendChild(btn);
  });
  tc.appendChild(tg);f.appendChild(tc);

  // Data source / API provider
  var dc=h("div",{style:{background:t.card,border:"1px solid "+t.border,borderRadius:"12px",padding:"16px",maxWidth:"600px",marginTop:"12px"}});
  dc.appendChild(h("h3",{style:{margin:"0 0 10px",fontSize:"15px",fontWeight:"600"}},"\u26A1 API Data Provider"));

  // Provider selector
  var provRow=h("div",{style:{display:"flex",gap:"0",marginBottom:"14px",borderRadius:"8px",overflow:"hidden",border:"1px solid "+t.border}});
  [["finnhub","Finnhub (Recommended)"],["fmp","FMP (Legacy)"]].forEach(function(p){
    var active=S.provider===p[0];
    provRow.appendChild(h("button",{style:{
      flex:"1",padding:"10px 12px",border:"none",fontSize:"12px",fontWeight:"600",fontFamily:"inherit",
      background:active?t.accentGlow:"transparent",color:active?t.accent:t.tm,
      borderBottom:active?"2px solid "+t.accent:"2px solid transparent",transition:"all .2s"
    },onClick:function(){S.provider=p[0];try{localStorage.setItem("mexxie_provider",p[0])}catch(x){};render()}},p[1]));
  });
  dc.appendChild(provRow);

  if(S.provider==="finnhub"){
    // Finnhub key input
    var fhRow=h("div",{style:{marginBottom:"14px"}});
    fhRow.appendChild(h("label",{style:{fontSize:"12px",fontWeight:"600",display:"block",marginBottom:"4px",color:t.text}},"Finnhub API Key"));
    fhRow.appendChild(h("p",{style:{fontSize:"11px",color:t.tm,marginBottom:"6px",lineHeight:"1.4"}},"Free: 60 calls/min, NO daily limit. Sign up at finnhub.io/register"));
    var fhInput=h("input",{type:"password",value:S.finnhubKey||"",placeholder:"Paste your Finnhub API key here...",style:{
      width:"100%",padding:"10px 12px",borderRadius:"8px",border:"1px solid "+t.border,
      background:t.surface,color:t.text,fontSize:"13px",fontFamily:"'IBM Plex Mono',monospace",
      outline:"none",transition:"border .2s"
    },onInput:function(e){S.finnhubKey=e.target.value.trim();try{localStorage.setItem("mexxie_finnhub_key",S.finnhubKey)}catch(x){}},onFocus:function(){this.style.borderColor=t.accent},onBlur:function(){this.style.borderColor=t.border}});
    fhRow.appendChild(fhInput);
    dc.appendChild(fhRow);

    // Finnhub test connection
    var testRow=h("div",{style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"14px"}});
    var testBtn=h("button",{style:{
      padding:"8px 16px",borderRadius:"8px",border:"1px solid "+t.buy+"66",
      background:t.buyGlow,color:t.buy,fontSize:"12px",fontWeight:"600",fontFamily:"inherit"
    },onClick:async function(){
      if(!S.finnhubKey){alert("Enter a Finnhub API key first.\n\nGet free key at: finnhub.io/register");return}
      try{
        var r=await fetch(FINNHUB_BASE+"/quote?symbol=AAPL&token="+S.finnhubKey);
        var d=await r.json();
        if(d&&d.c&&d.c>0){
          alert("\u2705 Finnhub connected! AAPL: $"+d.c+" ("+((d.dp>=0?"+":"")+d.dp.toFixed(2))+"% today)\nClick \u26A1 Live Refresh to update all stocks.");
        }else if(d&&d.error){
          alert("API Error: "+d.error);
        }else{alert("Unexpected response. Check your key or try again.")}
      }catch(e){alert("Connection failed: "+e.message)}
    }},"\u26A1 Test Connection");
    testRow.appendChild(testBtn);
    if(S.finnhubKey){
      testRow.appendChild(h("span",{style:{fontSize:"11px",color:t.buy}},"\u2713 Key entered ("+S.finnhubKey.slice(0,4)+"..."+S.finnhubKey.slice(-4)+")"));
    }else{
      testRow.appendChild(h("span",{style:{fontSize:"11px",color:t.tm}},"No key \u2014 using simulated data"));
    }
    dc.appendChild(testRow);
  }else{
    // FMP key input
    var keyRow=h("div",{style:{marginBottom:"14px"}});
    keyRow.appendChild(h("label",{style:{fontSize:"12px",fontWeight:"600",display:"block",marginBottom:"4px",color:t.text}},"Financial Modeling Prep API Key"));
    keyRow.appendChild(h("p",{style:{fontSize:"11px",color:t.tm,marginBottom:"6px",lineHeight:"1.4"}},"Free: 250 calls/day. Sign up at financialmodelingprep.com"));
    var keyInput=h("input",{type:"password",value:S.apiKey||"",placeholder:"Paste your FMP API key here...",style:{
      width:"100%",padding:"10px 12px",borderRadius:"8px",border:"1px solid "+t.border,
      background:t.surface,color:t.text,fontSize:"13px",fontFamily:"'IBM Plex Mono',monospace",
      outline:"none",transition:"border .2s"
    },onInput:function(e){S.apiKey=e.target.value.trim();try{localStorage.setItem("mexxie_api_key",S.apiKey)}catch(x){}},onFocus:function(){this.style.borderColor=t.accent},onBlur:function(){this.style.borderColor=t.border}});
    keyRow.appendChild(keyInput);
    dc.appendChild(keyRow);

    // FMP test connection
    var testRow=h("div",{style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"14px"}});
    var testBtn=h("button",{style:{
      padding:"8px 16px",borderRadius:"8px",border:"1px solid "+t.buy+"66",
      background:t.buyGlow,color:t.buy,fontSize:"12px",fontWeight:"600",fontFamily:"inherit"
    },onClick:async function(){
      if(!S.apiKey){alert("Enter an API key first");return}
      try{
        var r=await fetch(FMP_BASE+"/quote?symbol=AAPL&apikey="+S.apiKey);
        var d=await r.json();
        if(d&&Array.isArray(d)&&d[0]&&d[0].price){
          alert("\u2705 FMP Connected! AAPL price: $"+d[0].price+"\nClick \u26A1 Live Refresh to update all stocks.");
        }else if(d&&(d["Error Message"]||d.message)){
          alert("API Error: "+(d["Error Message"]||d.message));
        }else if(d&&d.error){
          alert("API Error: "+d.error);
        }else{alert("Unexpected response. Check your key or try again.")}
      }catch(e){alert("Connection failed: "+e.message)}
    }},"\u26A1 Test Connection");
    testRow.appendChild(testBtn);
    if(S.apiKey){
      testRow.appendChild(h("span",{style:{fontSize:"11px",color:t.buy}},"\u2713 Key entered ("+S.apiKey.slice(0,4)+"..."+S.apiKey.slice(-4)+")"));
    }else{
      testRow.appendChild(h("span",{style:{fontSize:"11px",color:t.tm}},"No key \u2014 using simulated data"));
    }
    dc.appendChild(testRow);
  }

  // Clear Cache button
  var cacheRow=h("div",{style:{display:"flex",gap:"8px",alignItems:"center",marginBottom:"14px"}});
  var clearBtn=h("button",{style:{
    padding:"6px 12px",borderRadius:"8px",border:"1px solid "+t.border,
    background:t.surface,color:t.tm,fontSize:"11px",fontWeight:"600",fontFamily:"inherit"
  },onClick:function(){
    try{localStorage.removeItem("mexxie_ratios_cache");localStorage.removeItem("mexxie_finnhub_cache");localStorage.removeItem("mexxie_api_key");localStorage.removeItem("mexxie_finnhub_key")}catch(e){}
    S.apiKey="gi9xNO7CWDJhG2xupgJaO0wuarOBRUei";S.finnhubKey="d6ebj19r01qloir5vun0d6ebj19r01qloir5vung";
    alert("All caches and keys cleared. Enter a new API key to continue.");render();
  }},"\uD83D\uDDD1 Clear All Cache");
  cacheRow.appendChild(clearBtn);
  var cacheInfo="";
  var cacheKey=S.provider==="finnhub"?"mexxie_finnhub_cache":"mexxie_ratios_cache";
  try{var c=JSON.parse(localStorage.getItem(cacheKey));if(c&&c.ts){var age=Math.round((Date.now()-c.ts)/3600000);cacheInfo=Object.keys(c.data||{}).length+" ratios cached ("+age+"h ago)"}}catch(e){}
  cacheRow.appendChild(h("span",{style:{fontSize:"10px",color:t.tm}},cacheInfo||"No cache"));
  dc.appendChild(cacheRow);

  // Info items (provider-specific)
  var infoItems=S.provider==="finnhub"?[
    ["\u26A1","FINNHUB (RECOMMENDED):","Free tier: 60 API calls/minute with NO daily cap. Covers 60+ global exchanges with 117+ fundamental metrics per stock. Real prices, P/E, P/B, ROE, dividend yields, debt ratios, and market cap for all 130 stocks."],
    ["\u21BB","SIMULATE MODE:","Without an API key, \u201CSimulate\u201D re-randomizes all data to demonstrate how the screener works. No internet required."],
    ["\u23F1","RATE LIMITING:","Finnhub allows 60 calls/min. The app automatically paces requests with smart batching. First refresh fetches quotes + fundamentals (~280 calls, ~5 min). Subsequent refreshes use cached fundamentals (~150 calls, ~3 min)."],
    ["\uD83D\uDCE6","SMART CACHE:","Fundamental metrics (P/E, P/B, ROE, etc.) are cached for 24 hours since they change quarterly. Price quotes are always fetched fresh. Use \u201CClear All Cache\u201D to force a full re-fetch."],
    ["\uD83D\uDD12","PRIVACY:","API keys and cached data are stored only in your browser\u2019s localStorage. Data goes directly to Finnhub\u2019s servers \u2014 never through any third party."]
  ]:[
    ["\u26A1","FMP (LEGACY):","250 API calls/day. Many international stocks require Premium. Consider switching to Finnhub for better free-tier coverage."],
    ["\u21BB","SIMULATE MODE:","Without an API key, \u201CSimulate\u201D re-randomizes all data. No internet required."],
    ["\uD83D\uDCB0","FREE TIER:","FMP free plan: 250 calls/day. Fundamental ratios cached 24h, so subsequent refreshes use ~150 calls. 1\u20132 full refreshes per day."],
    ["\uD83D\uDCE6","SMART CACHE:","Fundamental ratios cached in localStorage for 24 hours. Price quotes always fetched fresh."],
    ["\uD83D\uDD12","PRIVACY:","API key and cached ratios stored in localStorage only. Data sent directly to FMP servers."]
  ];
  infoItems.forEach(function(item){
    var row=h("div",{style:{display:"flex",gap:"8px",marginBottom:"8px",alignItems:"flex-start"}});
    row.appendChild(h("span",{style:{fontSize:"14px",flexShrink:"0",lineHeight:"1.4"}},item[0]));
    var txt=h("div",{style:{fontSize:"11px",lineHeight:"1.5"}});
    txt.appendChild(h("span",{style:{fontWeight:"700",color:t.text}},item[1]+" "));
    txt.appendChild(h("span",{style:{color:t.ts}},item[2]));
    row.appendChild(txt);
    dc.appendChild(row);
  });

  // Last refresh stats
  if(S.refreshCount>0){
    var stats=h("div",{style:{marginTop:"10px",padding:"8px 12px",background:t.surface,borderRadius:"6px",fontSize:"11px",color:t.ts}});
    stats.appendChild(h("div",null,"Source: "+S.lastSource+" \u00B7 Refreshes: "+S.refreshCount+" \u00B7 API calls: "+S.lastCalls));
    if(S.lastErrors&&S.lastErrors.length>0){
      stats.appendChild(h("div",{style:{color:t.sell,marginTop:"4px"}},"Errors: "+S.lastErrors.slice(0,3).join("; ")));
    }
    dc.appendChild(stats);
  }

  f.appendChild(dc);

  return f;
}

  var t=T();
  var ft=h("div",{style:{borderTop:"1px solid "+t.border,padding:"12px 16px",marginTop:"32px",textAlign:"center"}});
  ft.appendChild(h("p",{style:{margin:"0",fontSize:"10px",color:t.tm,lineHeight:"1.6"}},"Mexxie Ultimate World Stock Investing \u2014 Educational tool only, not investment advice. Past performance does not guarantee future results. Consult a qualified financial advisor."));
  return ft;
}

render();

// Register PWA Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    console.log('Mexxie SW registered',reg.scope);
  }).catch(function(err){console.log('SW registration failed',err)});
}
</script>
